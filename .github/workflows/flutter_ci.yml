name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Pushes to main queue up and always finish (a run cancelled while it uploads
# a release would leave a half-published "latest" release); only superseded
# pull request runs are cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # — Job 1: Test —
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Run analysis
      run: flutter analyze

    - name: Run tests
      run: flutter test

  # — Job 2: Build & Deploy —
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Read version
      id: version
      run: |
        NAME=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    # The version shown in Settings: pubspec version, run number (same as the
    # APK's versionCode and the release tag) and commit. Never edited by hand.
    - name: Build Flutter web (PWA)
      run: >
        flutter build web --release --base-href /kalorat/app/ --no-web-resources-cdn
        --build-number=${{ github.run_number }}
        --dart-define=APP_VERSION=${{ steps.version.outputs.name }}
        --dart-define=APP_BUILD=${{ github.run_number }}
        --dart-define=APP_COMMIT=${{ github.sha }}

    - name: Generate service worker
      run: npx --yes workbox-cli@7.3.0 generateSW workbox-config.cjs

    - name: Assemble site structure
      run: |
        mkdir -p _site/app
        # Landing page → root
        cp landing/index.html _site/index.html
        # Pages serves it for every missing path
        cp landing/404.html _site/404.html
        # Flutter build → /app/
        cp -r build/web/* _site/app/
        # Merge Assets (from both root and landing)
        mkdir -p _site/assets
        cp -r assets/* _site/assets/ 2>/dev/null || true
        cp -r landing/assets/* _site/assets/ 2>/dev/null || true
        # Custom domain
        echo "nikity.is-a.dev" > _site/CNAME
        # Prevent Jekyll processing (important for Flutter assets)
        touch _site/.nojekyll

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # — Job 3: Build & Release APK —
  build-apk:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Read version
        id: version
        run: |
          NAME=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # The run number is the Android versionCode, so every build installs as
      # an update over the previous one.
      - name: Build APK
        run: >
          flutter build apk --release --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.version.outputs.name }}
          --dart-define=APP_BUILD=${{ github.run_number }}
          --dart-define=APP_COMMIT=${{ github.sha }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH: upload-keystore.jks

      # One release per build. The asset keeps the fixed name app-release.apk,
      # so releases/latest/download/app-release.apk (the landing page link)
      # always serves the newest build. gh publishes the release only after the
      # asset is uploaded, so "latest" never points at a release without it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Kalorat ${{ steps.version.outputs.name }} (build ${{ github.run_number }})" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --latest

    content="kalorat, nutrition tracking, calorie tracker, HOPE LLC, styrian forest green, meal logger, health companion">

  <!-- Open Graph -->
  <meta property="og:title" content="Kalorat | The System. Absolute Clarity.">
  <meta property="og:description"
    content="Precise, honest nutrition tracking. Engineered by HOPE LLC with fluid precision.">

  <!-- Theme Color — white canvas, matches manifest and splash -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to Gemini API for faster first request -->
  <link rel="preconnect" href="https://generativelanguage.googleapis.com">
  <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">

  <style>
    /* Prevent double-highlight from browser native selection (Flutter renders its own) */
    ::selection {
      background: transparent;
    }

    ::-moz-selection {
      background: transparent;
    }

    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Splash: identical to the Flutter loading screen in main.dart (white,
       100px logo, 24px gap, forest spinner) so start-up has no visual jump. */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #FFFFFF;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease-out;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 100px;
      height: 100px;
      background: url('assets/assets/kalorat-favicon-android.webp') center / contain no-repeat;
      margin-bottom: 24px;
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 4px solid transparent;
      border-top-color: #0F5838;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="splash-logo"></div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      const notifyUpdate = () =>
        window.dispatchEvent(new CustomEvent('flutter-pwa-update-available'));

      window.addEventListener('load', () => {
        // Fonts are bundled now; drop the runtime cache older versions filled.
        if (window.caches) caches.delete('google-fonts').catch(() => {});
        navigator.serviceWorker.register('sw.js').then((reg) => {
          if (reg.waiting && navigator.serviceWorker.controller) notifyUpdate();
          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                notifyUpdate();
              }
            });
          });
          // Installed PWAs on iOS resume instead of reloading, so check for
          // a new version whenever the app comes back to the foreground.
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch((e) => console.warn('Service worker registration failed:', e));
      });

      // Reload only when the user asked for the update. The first install
      // also fires controllerchange (clientsClaim) and must not reload.
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!window.kaloratUpdateRequested) return;
        window.kaloratUpdateRequested = false;
        window.location.reload();
      });
    }

    window.skipWaitingAndReload = function () {
      if (!('serviceWorker' in navigator)) return window.location.reload();
      navigator.serviceWorker.getRegistration().then((reg) => {
        if (reg && reg.waiting) {
          window.kaloratUpdateRequested = true;
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        } else {
          window.location.reload();
        }
      });
    };

    // Downscales a photo to fit maxDimension and re-encodes it as JPEG.
    // Used before storing web photos (see photo_downscale_web.dart).
    window.kaloratDownscaleJpeg = async function (bytes, maxDimension, quality) {
      const bitmap = await createImageBitmap(new Blob([bytes]));
      const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; // JPEG has no alpha
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
      if (!blob) throw new Error('JPEG encoding failed');
      return new Uint8Array(await blob.arrayBuffer());
    };

    window.kaloratCameraPermissionGranted = async function () {
      try {
        return (await navigator.permissions.query({ name: 'camera' })).state === 'granted';
      } catch (_) {
        return false;
      }
    };
  </script>
  <script src="haptics.js"></script>
  <script src="flutter_bootstrap.js" async onEntrypointLoaded="onEntrypointLoaded"></script>
  <script>
    // Hook into Flutter bootstrap to remove splash
    // Note: The actual flutter_bootstrap.js might not expose onEntrypointLoaded as a global callback attribute directly depending on version,
    // but usually we can customize the loader. 
    // For standard Flutter Web, typically we inject the app runner.

    // Simplest robust method for PWA: Remove splash when the app is "ready".
    // Flutter Web apps usually remove the splash automatically if it's configured in manifest/index, 
    // but here we did a custom one.

    // Let's modify the flutter_bootstrap.js loading slightly to handle the splash removal.
    // Since we can't easily modify the pre-compiled logic, we'll use a MutationObserver 
    // to detect when Flutter injects the canvas/semantics.

    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.tagName === 'FLUTTER-VIEW') {
            // Flutter view added, fade out splash
            setTimeout(() => {
              const splash = document.getElementById('splash');
              if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 500);
              }
            }, 200); // Slight delay to ensure first frame render
            observer.disconnect();
          }
        }
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>

</html>

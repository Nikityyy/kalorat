<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO & Meta Tags -->
  <meta name="description"
    content="Kalorat — The System. Because tracking calories requires absolute clarity. Precise, honest nutrition tracking by Nikita Berger.">
  <meta name="keywords"
    content="kalorat, nutrition tracking, calorie tracker, Nikita Berger, styrian forest green, meal logger, health companion">
  <meta name="author" content="Nikita Berger">


  <!-- Open Graph -->
  <meta property="og:title" content="Kalorat | The System. Absolute Clarity.">
  <meta property="og:description"
    content="Precise, honest nutrition tracking. Engineered by Nikita Berger with fluid precision.">
  <meta property="og:image" content="icons/Icon-192.png">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Theme Color — the canvas of the light and the dark theme -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalorat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/Icon-512.png" />

  <title>Kalorat | The System. Absolute Clarity.</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to Gemini API for faster first request -->
  <!-- The app fetches its fonts only once main.dart.js runs; asking for
       them now saves that wait on the first start. -->
  <link rel="preload" href="assets/assets/fonts/Outfit-Regular.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Outfit-Medium.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Outfit-SemiBold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Outfit-Bold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Outfit-ExtraBold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-Regular.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-Medium.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-SemiBold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-Bold.ttf" as="fetch" type="font/ttf" crossorigin>

  <link rel="preconnect" href="https://generativelanguage.googleapis.com">
  <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">

  <style>
    /* The camera preview must cover its box; never letterbox the video. */
    flt-platform-view video { object-fit: cover !important; width: 100% !important; height: 100% !important; background: transparent !important; }
    /* Prevent double-highlight from browser native selection (Flutter renders its own) */
    ::selection {
      background: transparent;
    }

    ::-moz-selection {
      background: transparent;
    }

    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Splash: the web loading screen. Flutter shows a blank page underneath
       until the app is ready, then fades this out (see kaloratHideSplash). */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #FFFFFF;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease-out;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 100px;
      height: 100px;
      background: url('assets/assets/kalorat-favicon-android.webp') center / contain no-repeat;
      margin-bottom: 24px;
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      border: 4px solid transparent;
      border-top-color: #0F5838;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* The dark theme's canvas, until the app has loaded and knows the choice. */
    @media (prefers-color-scheme: dark) {
      body, #splash {
        background-color: #0A0A0A;
      }

      .splash-spinner {
        border-top-color: #1EB070;
      }
    }

    /* Measures the screen edges kept for the status bar and the home
       indicator; the app reads them through kaloratSafeArea. */
    #safe-area-probe {
      position: fixed;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>
</head>

<body>
  <div id="safe-area-probe"></div>
  <div id="splash">
    <div class="splash-logo"></div>
    <div class="splash-spinner"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      const notifyUpdate = () =>
        window.dispatchEvent(new CustomEvent('flutter-pwa-update-available'));

      window.addEventListener('load', () => {
        // Fonts are bundled now; drop the runtime cache older versions filled.
        if (window.caches) caches.delete('google-fonts').catch(() => {});
        navigator.serviceWorker.register('sw.js').then((reg) => {
          if (reg.waiting && navigator.serviceWorker.controller) notifyUpdate();
          reg.addEventListener('updatefound', () => {
            const worker = reg.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                notifyUpdate();
              }
            });
          });
          // Installed PWAs on iOS resume instead of reloading, so check for
          // a new version whenever the app comes back to the foreground.
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch((e) => console.warn('Service worker registration failed:', e));
      });

      // Reload only when the user asked for the update. The first install
      // also fires controllerchange (clientsClaim) and must not reload.
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!window.kaloratUpdateRequested) return;
        window.kaloratUpdateRequested = false;
        window.location.reload();
      });
    }

    window.skipWaitingAndReload = function () {
      if (!('serviceWorker' in navigator)) return window.location.reload();
      navigator.serviceWorker.getRegistration().then((reg) => {
        if (reg && reg.waiting) {
          window.kaloratUpdateRequested = true;
          reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        } else {
          window.location.reload();
        }
      });
    };

    // Downscales a photo to fit maxDimension and re-encodes it as JPEG.
    // Used before storing web photos (see photo_downscale_web.dart).
    window.kaloratDownscaleJpeg = async function (bytes, maxDimension, quality) {
      const bitmap = await createImageBitmap(new Blob([bytes]));
      const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; // JPEG has no alpha
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
      if (!blob) throw new Error('JPEG encoding failed');
      return new Uint8Array(await blob.arrayBuffer());
    };

    window.kaloratCameraPermissionGranted = async function () {
      try {
        return (await navigator.permissions.query({ name: 'camera' })).state === 'granted';
      } catch (_) {
        return false;
      }
    };
  </script>
  <script src="haptics.js"></script>
  <script src="camera_diagnostics.js"></script>
  <script src="camera_canvas.js"></script>
  <script src="camera_devices.js"></script>
  <script src="barcode_scanner.js"></script>
  <script src="file_export.js"></script>
  <script src="flutter_bootstrap.js" async onEntrypointLoaded="onEntrypointLoaded"></script>
  <script>
    // The splash is the only loading indicator on the web: Flutter shows a
    // blank page until the app is initialised, then calls this once the first
    // real screen is painted.
    let splashHidden = false;
    window.kaloratHideSplash = function () {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(() => splash.remove(), 400);
    };
    // The page is not stretched under the status bar (no viewport-fit=cover:
    // with it, touches on an iPhone home screen app landed off target), so
    // CSS reports no insets there. As a home screen app on an iPhone with a
    // home indicator the page still reaches the bottom edge, so that inset
    // is known: 34 pt in portrait on every Face ID iPhone.
    window.kaloratSafeArea = function () {
      const probe = document.getElementById('safe-area-probe');
      const s = probe ? getComputedStyle(probe) : null;
      const px = (v) => (s ? parseFloat(v) || 0 : 0);
      let bottom = s ? px(s.paddingBottom) : 0;
      const homeIndicator =
        navigator.standalone === true &&
        /iPhone/.test(navigator.userAgent) &&
        Math.max(screen.width, screen.height) >= 812;
      if (homeIndicator) bottom = Math.max(bottom, 34);
      return [s ? px(s.paddingTop) : 0, s ? px(s.paddingRight) : 0, bottom, s ? px(s.paddingLeft) : 0].join(',');
    };
    // Safety net: never leave the splash covering the app if it never signals.
    setTimeout(window.kaloratHideSplash, 15000);
  </script>
</body>

</html>

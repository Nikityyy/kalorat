  /* An Austrian trail signpost: yellow arrows, black type, the red-white-red
     marker at the tail. The one place on the site that yellow appears. */
  :root { --sign: #F7D117; }
  body { min-height: 100vh; min-height: 100svh; }
  .nf { min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 0 64px; padding: 28px var(--gutter) 0; overflow: hidden; }

  .nf-logo svg { width: 100%; height: auto; }
  .nf-copy { align-self: center; padding-bottom: 8vh; }

  .nf-hint { margin-top: 24px; max-width: 34ch; font-size: 1.1875rem; color: var(--ink-2); }
  .post { position: relative; align-self: end; justify-self: start; display: flex; flex-direction: column; align-items: flex-start; padding-top: 12vh; }
  .post::before { content: ""; position: absolute; left: 22px; top: calc(12vh - 28px); bottom: 0; width: 14px; background: linear-gradient(90deg, #5F665F, #8A918A 45%, #5F665F); border-radius: 3px 3px 0 0; }
  .post ul { position: relative; display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .sign { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 18px; width: min(460px, 78vw); min-height: 76px; padding: 0 64px 0 0; background: var(--sign); color: var(--ink); text-decoration: none; clip-path: polygon(0 0, calc(100% - 38px) 0, 100% 50%, calc(100% - 38px) 100%, 0 100%); transform-origin: 29px 50%; transition: transform .6s var(--spring); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12); }
  .sign::before { content: ""; align-self: stretch; background: linear-gradient(var(--marker) 0 33.4%, #fff 33.4% 66.6%, var(--marker) 66.6%); }
  .sign b { font-size: 1.375rem; font-weight: 800; font-stretch: 108%; letter-spacing: -.01em; line-height: 1.1; }
  .sign span { font-size: 1.0625rem; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sign:hover, .sign:focus-visible { transform: rotate(-2.5deg) translateX(6px); }
  .sign:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .post li:nth-child(2) .sign { width: min(420px, 74vw); }
  .post li:nth-child(3) .sign { width: min(390px, 70vw); }
  .post-foot { position: relative; height: 22vh; }
  @media (prefers-reduced-motion: no-preference) {
    .js .sign { animation: sign-in .9s var(--ease) both; animation-delay: calc(.15s + var(--i) * .12s); }
    @keyframes sign-in { from { transform: translateX(-40px); opacity: 0; } }
    .js .nf-copy > * { animation: copy-in 1s var(--ease) both; }
    .js .nf-copy > :nth-child(2) { animation-delay: .08s; }
    .js .nf-copy > :nth-child(3) { animation-delay: .16s; }
    @keyframes copy-in { from { transform: translateY(24px); opacity: 0; } }
  }
  @media (max-width: 860px) {
    .nf { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; padding: 20px 20px 0; }

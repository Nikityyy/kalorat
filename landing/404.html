    sprites = [];
    for (var k = 0; k < 7; k++) sprites.push(sprite((.14 + k / 6 * .26) * cell, '#A8B3AD', .16 + k / 6 * .34));
    sprites.push(sprite(.36 * cell, '#6BCB97', 1));
    layer = document.createElement('canvas'); layer.width = c.width; layer.height = c.height;
    var L = layer.getContext('2d');
    L.fillStyle = '#0A0D0B'; L.fillRect(0, 0, layer.width, layer.height);
    for (i = 0; i < n; i++) put(L, i, hx[i], hy[i]);
    ready = true; draw(); wake();
  }
  function put(g, i, X, Y) {
    var sp = sprites[lv[i]], h = sp.width / 2;
    g.drawImage(sp, X * dpr - h, Y * dpr - h);
  }
  function moved(i) { return ox[i] > .4 || ox[i] < -.4 || oy[i] > .4 || oy[i] < -.4; }

  // Each frame: the still matrix in one copy, then only the dots that moved,
  // each lifted from its cell and drawn where the push has sent it.
  function draw() {
    x.drawImage(layer, 0, 0);
    var e = cell * dpr, i;
    x.fillStyle = '#0A0D0B';
    for (i = 0; i < n; i++) if (moved(i)) x.fillRect(hx[i] * dpr - e / 2, hy[i] * dpr - e / 2, e, e);
    for (i = 0; i < n; i++) if (moved(i)) put(x, i, hx[i] + ox[i], hy[i] + oy[i]);
    var now = performance.now();
    ripples.forEach(function (r) {
      var a = (now - r.t) / 1100;
      x.strokeStyle = 'rgba(107,203,151,' + Math.max(0, 1 - a).toFixed(3) + ')'; x.lineWidth = 1.5 * dpr;
      x.beginPath(); x.arc(r.x * dpr, r.y * dpr, a * 900 * dpr, 0, 6.2832); x.stroke();
    });
  }
  function step() {
    raf = 0;
    if (!ready) return;
    px += (tx - px) * .35; py += (ty - py) * .35;
    var R = W < 760 ? 90 : 130, now = performance.now(), live = false;
    ripples = ripples.filter(function (r) { return now - r.t < 1100; });
    for (var i = 0; i < n; i++) {
      var ax = 0, ay = 0, X = hx[i] + ox[i], Y = hy[i] + oy[i];
      var dx = X - px, dy = Y - py;
      if (dx < R && dx > -R && dy < R && dy > -R) {
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < R) { var f = 1 - d / R; f = f * f * 3.2; ax += dx / d * f; ay += dy / d * f; }
      }
      for (var j = 0; j < ripples.length; j++) {
        var rp = ripples[j], rx = X - rp.x, ry = Y - rp.y, rd = Math.sqrt(rx * rx + ry * ry) || 1, age = (now - rp.t) / 1100;
        var band = rd - age * 900;
        if (band < 26 && band > -26) { var gg = (1 - Math.abs(band) / 26) * 2.4 * (1 - age); ax += rx / rd * gg; ay += ry / rd * gg; }
      }
      if (ax === 0 && ay === 0 && ox[i] === 0 && oy[i] === 0 && vx[i] === 0 && vy[i] === 0) continue;
      vx[i] = (vx[i] + ax - ox[i] * .08) * .8; vy[i] = (vy[i] + ay - oy[i] * .08) * .8;
      ox[i] += vx[i]; oy[i] += vy[i];
      if (Math.abs(ox[i]) < .05 && Math.abs(oy[i]) < .05 && Math.abs(vx[i]) < .05 && Math.abs(vy[i]) < .05) ox[i] = oy[i] = vx[i] = vy[i] = 0;
      else live = true;
    }
    draw();
    if (live || ripples.length || Math.abs(tx - px) > .5 || Math.abs(ty - py) > .5) wake();
  }
  function wake() { if (!raf && !reduce && !document.hidden) raf = requestAnimationFrame(step); }

  // The pointer is the scanner; what is under it is read out, and it is 0 kcal.
  function aim(e) {
    tx = e.clientX; ty = e.clientY;
    scope.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    var over = e.target.closest && e.target.closest('a, button, h1, p');
    scope.classList.toggle('is-on', !over && (e.pointerType !== 'touch' || e.buttons > 0 || e.type === 'pointerdown'));
    scope.classList.toggle('is-flip', tx > innerWidth - 220);
    if (ready) {
      var ci = Math.floor(tx / cell), ri = Math.floor(ty / cell);
      var on = ci >= 0 && ci < cols && ri >= 0 && ri < rows && dig[ri * cols + ci];
      scope.classList.toggle('is-big', !!on);
      scopeT.textContent = on ? S.onDigits : S.onTable;
    }
    wake();
  }
  addEventListener('pointermove', aim);
  addEventListener('pointerdown', function (e) { if (e.target !== c) return; aim(e); scan(e.clientX, e.clientY); });
  addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') { scope.classList.remove('is-on'); tx = ty = -1e4; wake(); } });
  document.addEventListener('pointerleave', function () { scope.classList.remove('is-on'); tx = ty = -1e4; wake(); });
  document.addEventListener('visibilitychange', wake);
  var rt = 0;
  addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(build, 150); });

  function go() {
    (document.fonts && document.fonts.load ? document.fonts.load('600 100px "JetBrains Mono"') : Promise.resolve()).catch(function () {}).then(build);
  }
  if (img.complete && img.naturalWidth) go(); else { img.onload = go; img.onerror = go; }
})();
</script>
